[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-gemma-local"
version = "0.1.0"
description = "Tiny local Gemma RAG for English and Japanese documents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Eiichi YAMAMOTO", email = "info@yeiichi.com" }
]
dependencies = [
  "chromadb>=1.5.9",
  "gradio>=5.0.0,<6",
  "langchain-chroma>=1.1.0",
  "langchain-community>=0.4.2",
  "langchain-core>=1.5.1",
  "langchain-text-splitters>=1.1.2",
  "numpy<2",
  "pypdf>=6.14.2",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "sentence-transformers>=3.0.0,<3.1",
  "transformers>=4.39.0,<4.42",
]

[project.optional-dependencies]
llama-cpp = [
  "llama-cpp-python>=0.3.16",
]

[project.scripts]
rag-gemma-local = "rag_gemma_local.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
docs = [
  "furo>=2025.9.25",
  "myst-parser>=4.0.1",
  "sphinx>=8.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_gemma_local"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
override-dependencies = [
  "onnxruntime<=1.19.2",
]
